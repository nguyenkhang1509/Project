<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AuraK Levelling — Quests</title>

    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="dashboard.css" />
    <link rel="stylesheet" href="quests.css" />

    <link
      rel="icon"
      type="image/png"
      href="https://api.sherbert.cimpress.io/v2/assets/re9hUY37Gzuv1nIqI83XS~200?signature=0aea1d3748e733558e0db947596d340cc66d53ae"
    />

    <script src="habiticaConfig.js" defer></script>
    <script src="habiticaAPI.js" defer></script>
  </head>

  <body>
    <script>
      (() => {
        try {
          if (localStorage.getItem("aurak_theme") === "light") {
            const r = document.documentElement.style;
            r.setProperty("--bg", "#f6f8ff");
            r.setProperty("--bg2", "#eef2ff");
            r.setProperty("--card", "rgba(2, 6, 23, 0.05)");
            r.setProperty("--card2", "rgba(2, 6, 23, 0.08)");
            r.setProperty("--stroke", "rgba(2, 6, 23, 0.12)");
            r.setProperty("--stroke2", "rgba(2, 6, 23, 0.18)");
            r.setProperty("--text", "#081022");
            r.setProperty("--muted", "rgba(8, 16, 34, 0.62)");
            r.setProperty("--aquaSoft", "rgba(34, 211, 238, 0.1)");
            r.setProperty("--violetSoft", "rgba(168, 85, 247, 0.1)");
            r.setProperty("--shadow", "0 18px 50px rgba(2, 6, 23, 0.1)");
            r.setProperty("--shadow2", "0 24px 70px rgba(2, 6, 23, 0.14)");
          }
        } catch (e) {}
      })();
    </script>
    <main class="dashboard-screen" aria-label="Aura System">
      <aside class="sidebar" aria-label="AuraK Sidebar">
        <div class="sidebar-top">
          <a
            class="brand brand-link"
            href="dashboard.html"
            aria-label="Go to Dashboard"
          >
            <span class="brand-glow" aria-hidden="true"></span>

            <span class="brand-logoWrap" aria-hidden="true">
              <img
                class="brand-logo"
                src="https://api.sherbert.cimpress.io/v2/assets/re9hUY37Gzuv1nIqI83XS~200?signature=0aea1d3748e733558e0db947596d340cc66d53ae"
                alt=""
                width="46"
                height="46"
              />
            </span>

            <span class="brand-text">
              <span class="brand-name">AURAK</span>
              <span class="brand-sub">Levelling System</span>
            </span>

            <span class="brand-chip" aria-hidden="true">ONLINE</span>
          </a>

          <div class="side-card side-card-top" aria-label="Account Card">
            <div class="side-avatar" aria-hidden="true"></div>
            <div class="side-meta">
              <div class="side-user" id="sideUser">—</div>
              <div class="side-sub" id="sideSub">—</div>
            </div>
          </div>

          <nav class="side-nav" aria-label="Sidebar Navigation">
            <a class="side-link" href="dashboard.html">
              <i class="fa fa-chart-line side-fa"></i>
              Dashboard
            </a>

            <a class="side-link" href="profile.html">
              <i class="fa fa-user side-fa"></i>
              Profile
            </a>

            <a class="side-link" href="info.html">
              <i class="fa-solid fa-chart-simple side-fa"></i>
              Stats
            </a>

            <a class="side-link active" href="quests.html">
              <i class="fa-solid fa-list-check"></i>
              Quest
            </a>

            <a class="side-link" href="aura.html">
              <i class="fa-solid fa-comment"></i>
              Aura System
            </a>

            <a class="side-link" href="dungeon.html">
              <i class="fa-solid fa-skull"></i>
              Dungeon
            </a>
          </nav>
        </div>

        <div class="sidebar-bottom">
          <p class="sidebar-tip">
            Tip: Keep streaks small but consistent. Consistency compounds.
          </p>

          <a class="btn-logout" href="login.html">Logout</a>
        </div>
      </aside>

      <section class="main" aria-label="Aura System Main">
        <header class="topbar" aria-label="Top Bar">
          <div class="top-left" aria-label="Profile & XP">
            <div class="profile-name" id="dashName">—</div>

            <div class="profile-xp">
              <span class="profile-level" id="dashLevel">—</span>
              <span class="profile-xptext" id="dashXpText">—</span>
            </div>

            <div class="xpbar" aria-label="XP Progress">
              <div class="xpbar-bg">
                <div class="xpbar-fill" id="dashXpFill" style="width: 0%"></div>
              </div>
            </div>
          </div>

          <div class="top-actions" aria-label="Actions">
            <button type="button" class="btn">Add Log</button>
            <button type="button" class="btn primary">Start Challenge</button>
          </div>
        </header>

        <div class="qbar" aria-label="Quest filters and options">
          <div class="qtabs" role="tablist" aria-label="Quest Filters">
            <button
              class="qtab is-active"
              type="button"
              role="tab"
              data-filter="all"
            >
              All <span class="qcount" data-count="all">5</span>
            </button>

            <button
              class="qtab"
              type="button"
              role="tab"
              data-filter="physical"
            >
              <i class="fa-solid fa-dumbbell"></i>
              Physical <span class="qcount" data-count="physical">1</span>
            </button>

            <button
              class="qtab"
              type="button"
              role="tab"
              data-filter="intellectual"
            >
              <i class="fa-solid fa-brain"></i>
              Intellectual
              <span class="qcount" data-count="intellectual">1</span>
            </button>

            <button
              class="qtab"
              type="button"
              role="tab"
              data-filter="discipline"
            >
              <i class="fa-solid fa-shield-halved"></i>
              Discipline <span class="qcount" data-count="discipline">1</span>
            </button>

            <button
              class="qtab"
              type="button"
              role="tab"
              data-filter="confidence"
            >
              <i class="fa-solid fa-fire"></i>
              Confidence <span class="qcount" data-count="confidence">1</span>
            </button>

            <button class="qtab" type="button" role="tab" data-filter="mental">
              <i class="fa-solid fa-moon"></i>
              Mental <span class="qcount" data-count="mental">1</span>
            </button>
          </div>

          <label class="show-completed" aria-label="Show completed quests">
            <input id="showCompleted" type="checkbox" />
            <span class="sc-ui" aria-hidden="true"></span>
            <span class="sc-text">Show Completed</span>
          </label>
        </div>

        <div class="qlist" id="questList" aria-label="Quest List">
          <p
            style="text-align: center; color: var(--muted); padding: 40px 20px"
          >
            Loading challenges from Habitica API...
          </p>
        </div>

        <footer class="qfoot" aria-label="Quest footer">
          <p class="qhint">
            System rule: small quests, clear metrics, short deadlines. Stack
            wins fast.
          </p>
        </footer>
      </section>
    </main>
    <script src="quests.js" defer></script>
  </body>
</html>
