<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <script>
      (() => {
        try {
          const isLight = localStorage.getItem("aurak_theme") === "light";
          if (!isLight) return;

          document.documentElement.setAttribute("data-theme", "light");
          const r = document.documentElement.style;

          r.setProperty("--bg", "#f7f9ff");
          r.setProperty("--bg2", "#eef2ff");

          r.setProperty("--card", "rgba(255, 255, 255, 0.92)");
          r.setProperty("--card2", "rgba(255, 255, 255, 0.82)");

          r.setProperty("--stroke", "rgba(2, 6, 23, 0.10)");
          r.setProperty("--stroke2", "rgba(2, 6, 23, 0.16)");

          r.setProperty("--text", "#0a1022");
          r.setProperty("--muted", "rgba(10, 16, 34, 0.64)");

          r.setProperty("--aquaSoft", "rgba(34, 211, 238, 0.26)");
          r.setProperty("--violetSoft", "rgba(168, 85, 247, 0.24)");

          r.setProperty("--shadow", "0 14px 40px rgba(2, 6, 23, 0.12)");
          r.setProperty("--shadow2", "0 22px 60px rgba(2, 6, 23, 0.16)");
        } catch (e) {}
      })();
    </script>

    <link rel="stylesheet" href="dashboard.css" />
    <link rel="stylesheet" href="profile.css" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AuraK Levelling - Profile</title>

    <link
      rel="icon"
      type="image/png"
      href="https://api.sherbert.cimpress.io/v2/assets/re9hUY37Gzuv1nIqI83XS~200?signature=0aea1d3748e733558e0db947596d340cc66d53ae"
    />
  </head>

  <body>
    <main class="dashboard-screen" aria-label="AuraK Dashboard">
      <aside class="sidebar" aria-label="AuraK Sidebar">
        <div class="sidebar-top">
          <a
            class="brand brand-link"
            href="dashboard.html"
            aria-label="Go to Dashboard"
          >
            <span class="brand-glow" aria-hidden="true"></span>

            <span class="brand-logoWrap" aria-hidden="true">
              <img
                class="brand-logo"
                src="https://api.sherbert.cimpress.io/v2/assets/re9hUY37Gzuv1nIqI83XS~200?signature=0aea1d3748e733558e0db947596d340cc66d53ae"
                alt=""
                width="46"
                height="46"
              />
            </span>

            <span class="brand-text">
              <span class="brand-name">AURAK</span>
              <span class="brand-sub">Levelling System</span>
            </span>

            <span class="brand-chip" aria-hidden="true">ONLINE</span>
          </a>

          <div class="side-card side-card-top" aria-label="Account Card">
            <div class="side-avatar" aria-hidden="true"></div>
            <div class="side-meta">
              <div class="side-user" id="sideUser">—</div>
              <div class="side-sub" id="sideSub">—</div>
            </div>
          </div>

          <nav class="side-nav" aria-label="Sidebar Navigation">
            <a class="side-link" href="dashboard.html">
              <i class="fa fa-chart-line side-fa"></i>
              Dashboard
            </a>

            <a class="side-link active" href="profile.html">
              <i class="fa fa-user side-fa"></i>
              Profile
            </a>

            <a class="side-link" href="info.html">
              <i class="fa-solid fa-chart-simple side-fa"></i>
              Stats
            </a>

            <a class="side-link" href="quests.html">
              <i class="fa-solid fa-list-check"></i>
              Quest
            </a>

            <a class="side-link" href="aura.html">
              <i class="fa-solid fa-comment"></i>
              Aura System
            </a>

            <a class="side-link" href="journal.html">
              <i class="fa-solid fa-book"></i>
              Journal
            </a>
          </nav>
        </div>

        <div class="sidebar-bottom">
          <p class="sidebar-tip">
            Tip: Keep streaks small but consistent. Consistency compounds.
          </p>

          <button class="btn-logout" id="logoutBtn" type="button">
            Logout
          </button>
        </div>
      </aside>

      <section class="main" aria-label="Dashboard Main">
        <header class="topbar" aria-label="Top Bar">
          <div class="top-left" aria-label="Profile & XP">
            <div class="profile-name" id="dashName">—</div>

            <div class="profile-xp">
              <span class="profile-level" id="dashLevel">—</span>
              <span class="profile-xptext" id="dashXpText">—</span>
            </div>

            <div class="xpbar" aria-label="XP Progress">
              <div class="xpbar-bg">
                <div class="xpbar-fill" id="dashXpFill" style="width: 0%"></div>
              </div>
            </div>
          </div>

          <div class="top-actions" aria-label="Actions">
            <a class="btn primary" href="quests.html">Start Challenge</a>
          </div>
        </header>

       <div class="pr-wrap" aria-label="Profile Content">
  <div class="pr-head">
    <div class="pr-kicker">PROFILE</div>
    <div class="pr-title">Your Identity</div>
  </div>

  <section class="pr-card pr-identity" aria-label="Your Identity">
    <div class="pr-identityRow">
      <div class="pr-avatar" aria-hidden="true">
        <span class="pr-letter" id="prAvatarLetter">S</span>
      </div>

      <div class="pr-id">
        <div class="pr-name" id="pfName">—</div>
        <div class="pr-tag" id="pfTagline">—</div>
        <div class="pr-subRow">
          <span class="pr-handle" id="pfHandle">—</span>
          <span class="pr-join" id="prJoined">Joined —</span>
        </div>
      </div>

      <button class="pr-edit" id="prEditBtn" type="button">
        Edit Profile
      </button>
    </div>
  </section>

  <div class="pr-stack" aria-label="Profile Panels">
    <section class="pr-card pr-info" aria-label="Hunter Info">
      <div class="pr-cardHead">HUNTER INFO</div>

      <div class="pr-rows">
        <div class="pr-row">
          <span class="k">Level</span>
          <span class="v" id="pfLevel">—</span>
        </div>
        <div class="pr-row">
          <span class="k">Rank</span>
          <span class="v" id="pfRank">—</span>
        </div>
        <div class="pr-row">
          <span class="k">Streak</span>
          <span class="v" id="prStreak">—</span>
        </div>
        <div class="pr-row">
          <span class="k">Title</span>
          <span class="v" id="prTitle">—</span>
        </div>
      </div>
    </section>

    <section class="pr-card pr-sub" aria-label="Subscription">
      <div class="pr-subTop">
        <div class="pr-cardHead">SUBSCRIPTION</div>
        <span class="pr-pill" id="pfPlanBadge">—</span>
      </div>

      <div class="pr-subName" id="pfPlanName">—</div>
      <div class="pr-subDesc" id="pfPlanDesc">—</div>

      <button class="pr-upgrade" id="pfUpgradeBtn" type="button">
        Upgrade to Premium
      </button>

      <script>
        document.getElementById("pfUpgradeBtn").onclick = () => {
          window.location.href = "subscription.html";
        };
      </script>
    </section>
  </div>

  <!-- Edit modal -->
  <div class="pr-modal" id="prModal" aria-hidden="true">
    <div class="pr-modalCard" role="dialog" aria-modal="true">
      <div class="pr-modalHead">
        <div class="pr-modalTitle">Edit Profile</div>
        <button
          class="pr-x"
          id="prModalClose"
          type="button"
          aria-label="Close"
        >
          <i class="fa-solid fa-xmark"></i>
        </button>
      </div>

      <div class="pr-modalBody">
        <label class="pr-field">
          <span>Display name</span>
          <input
            id="pfInputName"
            type="text"
            placeholder="Your name"
            maxlength="28"
            autocomplete="nickname"
          />
          <div class="pr-miniRow">
            <span class="pr-mini" id="pfNameCount">0/28</span>
          </div>
        </label>

        <label class="pr-field">
          <span>Tagline</span>
          <input
            id="pfInputTagline"
            type="text"
            placeholder="Student • Builder • Athlete"
            maxlength="44"
            autocomplete="off"
          />
          <div class="pr-miniRow">
            <span class="pr-mini" id="pfTagCount">0/44</span>
          </div>
        </label>

        <label class="pr-field">
          <span>Bio</span>
          <textarea
            id="pfInputBio"
            rows="4"
            placeholder="Write your AuraK story (short + sharp)."
            maxlength="240"
          ></textarea>
          <div class="pr-miniRow">
            <span class="pr-mini" id="pfBioCount">0/240</span>
          </div>
        </label>

        <div class="pr-socials" aria-label="Social links">
          <div class="pr-social">
            <i class="fa-brands fa-instagram"></i>
            <input
              id="pfIg"
              type="text"
              placeholder="instagram handle"
              autocomplete="off"
              inputmode="text"
            />
            <button
              class="pr-miniBtn"
              id="pfIgClear"
              type="button"
              aria-label="Clear Instagram"
            >
              <i class="fa-solid fa-xmark"></i>
            </button>
          </div>

          <div class="pr-social">
            <i class="fa-brands fa-github"></i>
            <input
              id="pfGh"
              type="text"
              placeholder="github username"
              autocomplete="off"
              inputmode="text"
            />
            <button
              class="pr-miniBtn"
              id="pfGhClear"
              type="button"
              aria-label="Clear GitHub"
            >
              <i class="fa-solid fa-xmark"></i>
            </button>
          </div>

          <div class="pr-social">
            <i class="fa-solid fa-link"></i>
            <input
              id="pfLink"
              type="text"
              placeholder="portfolio link"
              autocomplete="url"
              inputmode="url"
            />
            <button
              class="pr-miniBtn"
              id="pfLinkClear"
              type="button"
              aria-label="Clear Link"
            >
              <i class="fa-solid fa-xmark"></i>
            </button>
          </div>
        </div>

        <div class="pr-saveRow">
          <div class="pr-saveMeta">
            <div class="pr-saved" id="pfLastSaved">—</div>
            <span class="pr-dirty" id="pfDirty" aria-hidden="true">Unsaved</span>
          </div>

          <button class="pr-save" id="pfSaveBtn" type="button">Save</button>
        </div>
      </div>
    </div>
  </div>
</div>
      </section>
    </main>

    <script type="module" src="profile.js"></script>
    <script src="theme.js"></script>
  </body>
</html>
